<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestro Hogar — Historia clínica (boceto)</title>
<style>
:root{
  --bg:#FBF1E8; --card:#ffffff; --ink:#4A2C20; --ink2:#6B4A3C; --muted:#8C7166; --line:#EAD9CC; --line2:#F7EBE1;
  --pri:#AE5535; --pri-ink:#ffffff; --pri-soft:#FBE3D6; --pri-hover:#F4C2A9; --pri-text:#8E3F24;
  --ok:#2e7d4f; --ok-soft:#e6f4eb;
  --warn:#9a5b00; --warn-soft:#fff3dc;
  --bad:#C62828; --bad-soft:#FDECEA;
  --band:#6b3d8f;
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:1.35rem}
h2{font-size:1.2rem;color:var(--pri-text)}
h3{font-size:1.05rem}
a{color:var(--pri-text)}
.band{position:sticky;top:0;z-index:50;background:var(--band);color:#fff;text-align:center;font-weight:700;letter-spacing:.06em;font-size:.85rem;padding:6px 12px}
.band span{font-weight:400;letter-spacing:0;opacity:.9}
/* encabezado */
.top{background:var(--pri);color:#fff;padding:12px 16px}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;cursor:pointer}
.logo{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.brand small{display:block;color:#FBE3D6;font-size:.78rem}
.brand .nh{font-family:Georgia,"Times New Roman",serif;text-transform:uppercase;letter-spacing:.08em;font-size:1.25rem;font-weight:700;color:#fff;display:block}
.brand .lema{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:.85rem;color:#fff;display:block}
.usr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.usr .who{font-size:.9rem;line-height:1.25}
.usr .who small{display:block;color:#FBE3D6;font-size:.75rem}
.rol{font-size:.75rem;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.btn.on-pri{background:transparent;color:#fff;border-color:#fff}
.btn.on-pri:hover{background:rgba(255,255,255,.15)}
/* navegación */
.nav{background:#fff;border-bottom:1px solid var(--line)}
.nav-in{max-width:1240px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 12px;-webkit-overflow-scrolling:touch}
.nav a{flex:none;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:.9rem;min-height:44px;display:flex;align-items:center;gap:4px}
.nav a.on{background:var(--pri-soft);color:var(--pri-text)}
.nav a:hover{background:var(--pri-hover)}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px;font-weight:700}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
/* botones */
.btn{min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--pri);background:var(--pri-soft)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.pri:hover{background:var(--pri-text);border-color:var(--pri-text)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ok:hover{background:#246640}
.btn.no{background:#fff;color:var(--bad);border-color:#e7b4ae}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.85rem;font-weight:500}
.btn.link{border:0;background:none;color:var(--ink2);text-decoration:underline;min-height:34px;padding:4px 6px;font-weight:400;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.hint{color:var(--ink2);font-size:.9rem;background:var(--line2);border-radius:8px;padding:8px 12px;margin:8px 0 14px}
.empty{color:var(--muted);font-style:italic;padding:10px 0}
.pill{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--line2);color:var(--ink2);font-weight:600}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.pri{background:var(--pri-soft);color:var(--pri-text)}
.alg{display:inline-block;background:var(--bad);color:#fff;font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:6px}
.alg::before{content:"\26A0  "}
.alg.none{background:var(--ok-soft);color:var(--ok);font-weight:700}
.alg.none::before{content:""}
/* inicio */
.home-h{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.home-h input[type=search]{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:280px;max-width:100%;background:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
.rcard{cursor:pointer;display:flex;flex-direction:column;gap:10px;margin:0}
.rcard:hover{border-color:var(--pri);background:#FFFAF6}
.rtop{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;background:var(--pri-soft);color:var(--pri-text);display:grid;place-items:center;font-weight:700;flex:none}
.alerts{display:flex;flex-direction:column;gap:6px}
.al{font-size:.85rem;padding:6px 10px;border-radius:6px;border-left:4px solid}
.al.bad{background:var(--bad-soft);border-color:var(--bad);color:#8A1C1C}
.al.bad::before{content:"\26A0  ";font-weight:700}
.al.warn{background:var(--warn-soft);border-color:#e0a030;color:#6b4000}
.al.ok{background:var(--ok-soft);border-color:var(--ok);color:#1d5233}
.al.info{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-text)}
/* ficha */
.rhead{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.rmeta{color:var(--ink2);font-size:.9rem;margin-top:2px}
.rgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:980px){.rgrid{grid-template-columns:240px 1fr}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
@media(min-width:980px){.tabs{flex-direction:column;overflow:visible;position:sticky;top:44px;align-self:start}}
.tab{flex:none;min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;white-space:nowrap;font-size:.92rem}
.tab:hover{background:var(--pri-hover)}
.tab.on,.tab.on:hover{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.panel{min-width:0}
.sec-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr;gap:0;margin:0}
@media(min-width:700px){.kv{grid-template-columns:1fr 1fr}}
.kv div{padding:9px 0;border-bottom:1px solid var(--line2)}
.kv dt{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kv dd{margin:2px 0 0}
.sub{margin:18px 0 8px;font-size:1rem;color:var(--pri-text)}
ul.li{margin:4px 0;padding-left:20px}
ul.li li{margin:3px 0}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
th{background:#FBF4EE;font-weight:600;color:var(--ink2);white-space:nowrap;font-size:.8rem}
td.num{text-align:right;white-space:nowrap}
td.hi{background:var(--bad-soft);color:var(--bad);font-weight:700}
td.hi::before{content:"\25B2 ";font-size:.7em}
tr.anul td{color:var(--muted);text-decoration:line-through}
tr.anul td.anl{text-decoration:none}
.stick{position:sticky;left:0;background:#fff;z-index:1}
/* registros */
.rec{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:12px 14px;margin-bottom:10px}
.rec.anulado{background:#fafafa}
.rec.anulado .body{text-decoration:line-through;color:var(--muted)}
.rec .top2{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
.firma{font-size:.82rem;color:var(--ink2)}
.firma b{color:var(--ink)}
.anul-note{margin-top:8px;font-size:.82rem;color:var(--bad);background:var(--bad-soft);padding:6px 10px;border-radius:6px}
.mod-note{margin-top:8px;font-size:.82rem;color:var(--ink2);background:var(--line2);padding:6px 10px;border-radius:6px}
.susp-note{margin-top:8px;font-size:.82rem;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:6px}
.prev{font-size:.85rem;color:var(--muted);margin-top:6px;padding-left:10px;border-left:3px solid var(--line)}
.prev s{color:var(--ink2)}
.rec.susp{background:#fafafa}
.rec.susp .body{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;min-height:40px;padding:6px 14px;cursor:pointer}
.seg button:hover{background:var(--pri-hover)}
.seg button.on{background:var(--pri-soft);color:var(--pri-text);font-weight:700}
.lock{font-size:.85rem;color:var(--ink2);background:var(--line2);border-radius:8px;padding:8px 12px;margin:6px 0 12px}
.egr{background:#EDE7E3;border:1px solid #CDBFB6;color:var(--ink);padding:10px 14px;border-radius:8px;margin-bottom:14px}
/* formularios */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(min-width:560px){.fgrid.c3{grid-template-columns:1fr 1fr 1fr}}
.fl{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink2);margin-bottom:10px}
.fl input,.fl select,.fl textarea{min-height:46px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:1rem;color:var(--ink);width:100%}
.fl textarea{min-height:80px;resize:vertical}
.fl input.hi{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:700}
.fl .u{font-size:.75rem;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;min-height:44px;font-size:.92rem;cursor:pointer}
.chk input{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chips label{cursor:pointer;position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:.9rem}
.chips input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.chips input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}
.glabel{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:4px}
.papel{border:1px dashed #d9b48f;background:#FFF8EF;border-radius:8px;padding:6px 10px;margin:6px 0 10px}
/* medicación */
.daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.daynav b{min-width:120px;text-align:center}
.turno{margin:14px 0 6px;font-weight:700;color:var(--ink2);font-size:.9rem;text-transform:uppercase;letter-spacing:.04em}
.slot{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;margin-bottom:8px}
.slot .sh{font-size:1.15rem;font-weight:700}
.slot .sa{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media(min-width:700px){.slot{grid-template-columns:70px 1fr auto}.slot .sa{grid-column:auto}}
.slot .sa .btn{min-height:48px;min-width:110px}
.slot.st-dado{border-left-color:var(--ok)}
.slot.st-no{border-left-color:var(--warn);background:#fffbf3}
.slot.st-atr{border-left-color:var(--bad);background:#fff7f6}
.slot.st-fut{opacity:.75}
.slot .old{font-size:.8rem;color:var(--muted);text-decoration:line-through}
/* gráfico */
.chart{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0 16px}
.chart svg{width:100%;height:auto;display:block}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.vchips button{min-height:38px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.vchips button:hover{background:var(--pri-hover)}
.vchips button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-text);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.dot{width:9px;height:9px;border-radius:50%}
.legend i.bandk{height:10px;width:14px;background:#e6f4eb;border:1px solid #bfe0cb}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;margin:6px 0 14px;font-size:.92rem}
.status.ok{background:var(--ok-soft);color:#1d5233}
.status.bad{background:var(--bad-soft);color:#8A1C1C}
.status.warn{background:var(--warn-soft);color:#6b4000}
/* ingreso */
.login{max-width:820px;margin:24px auto;padding:0 16px}
.ucards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.ucards{grid-template-columns:1fr 1fr}}
.ucard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:64px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}
.ucard:hover{border-color:var(--pri);background:#FFFAF6}
.ucard.off{opacity:.55}
.pinin{font-size:1.8rem;letter-spacing:.5em;text-align:center;min-height:60px!important}
.svcs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;min-height:110px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.svc:hover{border-color:var(--pri);background:var(--pri-soft)}
.svc b{font-size:1.2rem;color:var(--pri-text)}
.svc span{font-size:.85rem;color:var(--ink2)}
.svc small{color:var(--muted);font-size:.78rem;margin-top:auto}
@media(max-width:600px){.nav-in{flex-direction:column;overflow-x:visible;gap:2px;padding:6px 10px}.nav a{min-height:40px;padding:6px 12px;border-left:4px solid transparent}.nav a.on{border-left-color:var(--pri)}.nav a.on::before{content:"▶ ";font-size:.7rem}}
@media(max-width:600px){.svcs{gap:8px}.svc{min-height:0;padding:10px 12px;gap:2px}.svc b{font-size:1rem}.svc span{display:none}.svc small{margin-top:2px;font-size:.72rem}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:10px auto}
.keypad button{min-height:58px;font-size:1.3rem;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.keypad button:hover{background:var(--pri-soft)}
/* permisos */
.matrix td.y{color:var(--ok);font-weight:800;text-align:center}
.matrix td.n{color:#C9B8AD;text-align:center}
/* contingencia */
.cg{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;font-size:.9rem}
.cg-h{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.cg-res{border:1px solid var(--ink2);border-radius:6px;padding:10px;margin-bottom:12px;break-inside:avoid}
.cg-res table td,.cg-res table th{border:1px solid #bbb;padding:4px 6px;font-size:.82rem}
.cg-res table td.blank{height:26px}
.box{display:inline-block;width:15px;height:15px;border:1.5px solid var(--ink);vertical-align:middle;margin:0 3px 0 6px}
.lines{border-bottom:1px solid #bbb;height:24px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:14px 14px 14px 62px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800}
/* modal */
#modal{position:fixed;inset:0;background:rgba(40,25,18,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}
#modal.on{display:flex}
@media(min-width:700px){#modal{align-items:center;padding:20px}}
.mbox{background:#fff;width:100%;max-width:660px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px}
@media(min-width:700px){.mbox{border-radius:14px}}
.mbox h3{margin-bottom:10px;color:var(--pri-text)}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;position:sticky;bottom:-18px;background:#fff;padding:8px 0}
.merr{color:var(--bad);font-size:.9rem;margin-top:6px;min-height:1em;font-weight:600}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#4A2C20;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120;max-width:90vw}
#toast.on{opacity:1}
.idlew{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:130;background:var(--bad);color:#fff;border:0;border-radius:10px;padding:14px 20px;font:700 1rem system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;max-width:94vw}
footer{max-width:1240px;margin:20px auto 30px;padding:0 16px;color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.ranges{font-size:.8rem;color:var(--muted)}
/* legajo */
.legajo{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px;max-width:920px;font-size:.92rem}
.legajo h2{font-size:1.1rem;border-bottom:2px solid var(--ink);padding-bottom:4px;margin:26px 0 10px;color:var(--ink)}
.legajo h3{font-size:.95rem;margin:14px 0 6px}
.lg-cover{text-align:center;padding:30px 10px 10px}
.lg-cover .est{font-family:Georgia,serif;font-size:1.3rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.lg-cover .tit{font-size:1.5rem;font-weight:800;margin:28px 0 6px;letter-spacing:.03em}
.lg-box{border:1px solid var(--ink);border-radius:6px;padding:12px 16px;text-align:left;margin:22px auto;max-width:580px}
.lg-box div{padding:3px 0}
.lg-firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px 30px;margin-top:50px}
.lg-firmas div{border-top:1px solid var(--ink);padding-top:6px;font-size:.82rem;text-align:center}
.lg-ent{border-bottom:1px solid var(--line2);padding:7px 0}
.lg-ent.anulado .tx{text-decoration:line-through;color:var(--muted)}
.lg-warn{border:2px dashed var(--band);color:var(--band);padding:10px;border-radius:6px;font-size:.85rem;margin-top:18px}
@page{size:A4;margin:16mm 14mm 18mm 14mm}
@media print{
  body{background:#fff;font-size:10.5pt}
  .no-print,.top,.band,.nav,.tabs,.rhead,footer,#toast,#modal{display:none!important}
  .wrap{padding:0;max-width:none}
  .rgrid{display:block}
  .card{border:0;padding:0}
  .legajo,.cg{border:0;padding:0;max-width:none;font-size:10pt}
  .lg-sec{break-before:page}
  .cg-turno+.cg-turno{break-before:page}
  .lg-cover{min-height:240mm}
  table{font-size:8.5pt}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,.lg-ent,.rec{break-inside:avoid}
  .tscroll{overflow:visible;border:0}
  td.hi,.alg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pageStyle"></style>

let S=null, STORE_OK=true, SESSION=null, LAST_ACT=Date.now(), LAST_DOWNLOAD=null, MODAL_OK=null, LOGIN_MSG='';
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){STORE_OK=false;}return null;}

function storeNote(){if(!STORE_OK)$('#storeNote').textContent='Atención: este navegador no permite guardar. La demo funciona, pero lo cargado se pierde al cerrar la página.';}
function me(){return SESSION?S.users[SESSION.user]:null;}
function rol(){const u=me();return u?u.rol:'';}
function can(p){return !!SESSION&&(PERM_MAP[p]||[]).includes(rol());}
function canW(p,r){return can(p)&&(!r||r.estado==='activo');}
function uName(id){const u=S.users[id];return u?u.t+' '+u.n:String(id||'');}
function uFull(id){const u=S.users[id];if(!u)return String(id||'');if(u.rol==='esp')return u.t+' '+u.n+' ('+(u.esp||'Especialista')+', '+u.mat+')';return u.t+' '+u.n+' ('+((u.rol==='enf'||u.rol==='med')?u.mat:ROLES[u.rol])+')';}
function getRes(id){return S.residents.find(r=>r.id===id);}
function getInd(id){return S.ind.find(i=>i.id===id);}
function find(col,id){return S[col].find(x=>x.id===id);}
function valid(x){return !x.anul&&!x.corr;}
function byRes(col,rid,incl){return S[col].filter(x=>x.resId===rid&&(incl||valid(x))).sort((a,b)=>(a.ts||0)-(b.ts||0));}
function auditStr(e){return [e.n,e.ts,e.user,e.rol,e.accion,e.resId,e.detalle].join('|');}
function audit(accion,resId,detalle,userId){
  const u=userId||(SESSION&&SESSION.user)||'sistema';const prev=S.audit.length?S.audit[S.audit.length-1].h:'0';
  const e={n:S.audit.length+1,ts:Date.now(),user:u,rol:S.users[u]?S.users[u].rol:'-',accion,resId:resId||'',detalle:detalle||''};
  e.h=sha256js(prev+'|'+auditStr(e));S.audit.push(e);
}
function verifyAudit(list){list=list||S.audit;let prev='0';for(let i=0;i<list.length;i++){const e=list[i];if(e.n!==i+1||sha256js(prev+'|'+auditStr(e))!==e.h)return {ok:false,i:i+1,n:list.length};prev=e.h;}return {ok:true,n:list.length};}
function deny(que,resId){audit('Acceso denegado',resId,que);save();toast('Este usuario no tiene permiso para: '+que);return false;}
function add(col,o,accion){
  const now=Date.now();o.id=uid(col);if(!o.ts)o.ts=now;o.tc=now;o.por=SESSION.user;S[col].push(o);S.userAdded++;
  audit(accion||('Alta de '+COL_LBL[col]),o.resId,o.papel?'Cargado desde papel; hecho el '+fdt(o.ts):'');save();return o;
}
function canAnular(col,x){if(!x||x.anul||x.corr||!can('anular_propio'))return false;if(x.por===SESSION.user)return true;return col==='ind'&&rol()==='med';}
function canCorregir(col,x){return ['ctl','evm','eve','evesp','nov','inc','esc'].includes(col)&&x&&!x.anul&&!x.corr&&can('corregir_15')&&x.por===SESSION.user&&Date.now()-(x.tc||x.ts)<CORR_MIN*MIN;}

/* ---------- sesión ---------- */
function doLogin(userId,pin){
  const u=S.users[userId];if(!u)return {ok:false,msg:'Usuario inexistente.'};
  if(u.estado==='bloqueado'){audit('Intento de ingreso con usuario bloqueado','','',userId);save();return {ok:false,msg:'Usuario bloqueado. Lo desbloquea el administrador del sistema.'};}
  if(u.estado==='baja'){audit('Intento de ingreso con usuario dado de baja','','',userId);save();return {ok:false,msg:'Usuario dado de baja.'};}
  if(String(pin)!==u.pin){u.fallos=(u.fallos||0)+1;audit('PIN incorrecto','','Intento '+u.fallos+' de 5',userId);
    if(u.fallos>=5){u.estado='bloqueado';audit('Usuario bloqueado por intentos fallidos','','5 PIN incorrectos seguidos',userId);save();return {ok:false,msg:'PIN incorrecto 5 veces: el usuario quedó bloqueado.'};}
    save();return {ok:false,msg:'PIN incorrecto. Intento '+u.fallos+' de 5.'};}
  u.fallos=0;u.ultimo=Date.now();SESSION={user:userId,inicio:Date.now()};LAST_ACT=Date.now();LOGIN_MSG='';
  audit('Ingreso al sistema');save();return {ok:true};
}
function logout(auto){
  if(!SESSION)return;audit(auto?'Cierre automático por inactividad':'Cierre de sesión');save();SESSION=null;closeModal();
  LOGIN_MSG=auto?'La sesión se cerró sola por '+S.config.sesionMin+' minutos sin uso. Volvé a ingresar.':'Sesión cerrada.';UI.loginUser=null;UI.loginSvc=null;render();
}
function checkIdle(){
  const w=$('#idleWarn');if(!SESSION){if(w)w.hidden=true;return;}
  const rest=S.config.sesionMin*MIN-(Date.now()-LAST_ACT);
  if(rest<=0){if(w)w.hidden=true;logout(true);return;}
  if(w){if(rest<=30000){w.hidden=false;w.textContent='Tu sesión se cierra en '+Math.ceil(rest/1000)+' s por inactividad — tocá para seguir';}else w.hidden=true;}
}
function seguirSesion(){LAST_ACT=Date.now();checkIdle();}

function vigenteEn(ind,ts){if(ind.anul)return false;if(ind.fecha>ts)return false;if(ind.susp&&ind.susp.fecha<=ts)return false;if(ind.mod&&ind.mod.fecha<=ts)return false;return true;}

    const todos=S.dosis.filter(a=>a.indId===ind.id&&a.dia===dk&&a.hora===h);const val=todos.filter(a=>!a.anul);const reg=val[val.length-1];
    out.push({ind,hora:h,ts,reg,todos,estado:reg?reg.estado:'pend'});
  }));
  return out.sort((a,b)=>a.ts-b.ts||a.ind.farmaco.localeCompare(b.ind.farmaco));
}
function alergiasDe(r){return r.ant.alergias.concat(S.ax.filter(x=>x.resId===r.id&&x.sec==='ant'&&x.cat==='Alergia'&&valid(x)).map(x=>x.texto));}
function docEstado(r,item){const l=S.doc.filter(d=>d.resId===r.id&&d.item===item&&valid(d));return l.length?l[l.length-1]:null;}
function docFaltantes(r){return DOC_ITEMS.filter(it=>{const d=docEstado(r,it);return !d||d.estado==='Faltante';});}

/* ---------- alertas (según lo que el rol puede ver) ---------- */
function alertas(r){
  const a=[],now=Date.now();
  if(r.estado!=='activo'){a.push({l:'info',t:'Egresado el '+fdKey(r.egreso.fecha)+' — '+r.egreso.motivo});return a;}
  if(can('ver_clinica')){
    const c=byRes('ctl',r.id),last=c[c.length-1];
    if(last){const f=fueraDeRango(last);if(f.length)a.push({l:'bad',t:'Último control fuera de rango: '+f.join(', ')+' ('+fdt(last.ts)+')'});}
    if(!last||now-last.ts>24*HOUR)a.push({l:'warn',t:'Sin control de signos vitales en las últimas 24 h'+(last?' (último: '+fdt(last.ts)+')':'')});
    const sl=slotsDia(r.id,dayKey(now));
    const atr=sl.filter(s=>s.estado==='pend'&&s.ts+HOUR<now),nod=sl.filter(s=>s.estado==='no');
    if(atr.length)a.push({l:'bad',t:'Medicación sin registrar (atrasada): '+atr.map(s=>s.hora+' '+s.ind.farmaco).join(', ')});
    if(nod.length)a.push({l:'warn',t:'Medicación NO administrada hoy: '+nod.map(s=>s.hora+' '+s.ind.farmaco).join(', ')});
    const ev=byRes('evm',r.id),le=ev[ev.length-1];
    if(!le||now-le.ts>7*DAY)a.push({l:'bad',t:'Evolución médica semanal vencida'+(le?' (última: '+fd(le.ts)+', hace '+Math.floor((now-le.ts)/DAY)+' días)':'')});
    else if(now-le.ts>6*DAY)a.push({l:'warn',t:'Evolución médica semanal vence mañana (última: '+fd(le.ts)+')'});
    const inc=byRes('inc',r.id).filter(x=>now-x.ts<72*HOUR);
    if(inc.length)a.push({l:'warn',t:'Incidente en las últimas 72 h: '+inc.map(x=>x.tipo+' ('+fdt(x.ts)+')').join(', ')});
  }
  if(can('documentacion')||rol()==='med'){const f=docFaltantes(r);if(f.length)a.push({l:'warn',t:'Documentación faltante: '+f.join(', ')});}
  if(can('ver_agenda')){const p=S.age.filter(x=>x.resId===r.id&&valid(x)&&!x.cierre&&x.fecha>=now-2*HOUR&&x.fecha<=now+48*HOUR);
    p.forEach(x=>a.push({l:'info',t:'Turno: '+x.detalle+' — '+DIAS[new Date(x.fecha).getDay()]+' '+fdt(x.fecha)}));}
  return a;
}

function histHtml(r){
  if(!r.hist.length)return '<p class="small muted">Sin cambios desde el ingreso.</p>';
  return `<div class="tscroll"><table><thead><tr><th>Fecha</th><th>Dato</th><th>Antes</th><th>Después</th><th>Quién</th></tr></thead><tbody>${r.hist.slice().reverse().map(x=>`<tr><td>${fdt(x.ts)}</td><td>${esc(x.campo)}</td><td><s>${esc(x.antes)}</s></td><td>${esc(x.despues)}</td><td>${esc(uName(x.por))}</td></tr>`).join('')}</tbody></table></div>`;
}
function tabDatos(r){
  const ed=canW('datos',r),eg=canW('ingreso_egreso',r);
  return `<div class="card"><div class="sec-h"><h2>Datos personales e ingreso</h2><div class="row">${ed?`<button class="btn pri" onclick="formDatos('${r.id}')">Editar datos</button>`:''}${eg?`<button class="btn no" onclick="formEgreso('${r.id}')">Registrar egreso</button>`:''}</div></div>
    ${ed?'':`<p class="hint">Los datos personales los actualiza administración. Cada cambio queda registrado con el valor anterior.</p>`}

const EDIT_FIELDS=[['hab','Habitación y cama'],['domicilio','Domicilio previo'],['os','Obra social / prepaga'],['afil','N° de afiliado'],['familiar.n','Familiar responsable'],['familiar.par','Parentesco / rol'],['familiar.tel','Teléfono del familiar'],['emergencia','Contacto de emergencia'],['emergServ','Servicio de emergencias'],['medico','Médico de cabecera'],['grupo','Grupo y factor'],['directivas','Directivas anticipadas']];
function gp(o,p){return p.split('.').reduce((a,k)=>a&&a[k],o);}
function sp(o,p,v){const k=p.split('.');let a=o;for(let i=0;i<k.length-1;i++)a=a[k[i]];a[k[k.length-1]]=v;}
function formDatos(rid){
  const r=getRes(rid);if(!canW('datos',r))return deny('editar datos personales',rid);
  modal('Editar datos — '+r.ap+', '+r.no,`<p class="hint">Se guarda cada cambio con el valor anterior, la fecha y quién lo hizo.</p><div class="fgrid">${EDIT_FIELDS.map(f=>`<label class="fl">${f[1]}<input name="${f[0]}" value="${esc(gp(r,f[0]))}"></label>`).join('')}</div>`,'Guardar cambios',fd=>{
    const ch=[];EDIT_FIELDS.forEach(f=>{const v=String(fd.get(f[0])||'').trim();const old=String(gp(r,f[0])||'');if(v!==old){if(!v)return;ch.push([f,old,v]);}});
    if(!ch.length)return 'No cambiaste ningún dato.';
    ch.forEach(([f,old,v])=>{sp(r,f[0],v);r.hist.push({ts:Date.now(),campo:f[1],antes:old,despues:v,por:SESSION.user});audit('Cambio de datos personales',rid,f[1]+': "'+old+'" → "'+v+'"');});
    S.userAdded++;save();render();toast(ch.length+' dato(s) actualizado(s)');return true;});
}
function formEgreso(rid){
  const r=getRes(rid);if(!canW('ingreso_egreso',r))return deny('registrar egresos',rid);
  modal('Registrar egreso — '+r.ap+', '+r.no,`<p class="hint">El residente <b>no se borra</b>: pasa a "egresado" y su historia clínica queda guardada al menos 10 años (Ley 26.529 art. 18). Recordá asentarlo también en el Libro de ingresos y egresos rubricado (Ley 14.263 art. 8).</p>
    <label class="fl">Fecha de egreso<input type="date" name="fecha" value="${dayKey(Date.now())}" required></label>
    <div class="glabel">Motivo</div><div class="chips">${EGR_MOT.map((m,i)=>`<label><input type="radio" name="motivo" value="${esc(m)}"${i===0?' checked':''}><span>${esc(m)}</span></label>`).join('')}</div>
    <label class="fl">Detalle / destino<textarea name="detalle" rows="2"></textarea></label>`,'Registrar egreso',fd=>{
    const f=fd.get('fecha');if(!f||!/^\d{4}-\d{2}-\d{2}$/.test(f))return 'Falta la fecha.';if(f>dayKey(Date.now()))return 'La fecha no puede ser futura.';if(f<r.ingreso)return 'La fecha es anterior al ingreso.';
    r.estado='egresado';r.egreso={fecha:f,motivo:fd.get('motivo'),detalle:String(fd.get('detalle')||'').trim(),ts:Date.now(),por:SESSION.user};
    audit('Egreso de residente',rid,r.egreso.motivo);S.userAdded++;save();render();toast('Egreso registrado. La historia clínica queda guardada.');return true;});
}
function formIngreso(){
  if(!can('ingreso_egreso'))return deny('registrar ingresos');
  const F=[['ap','Apellido',1],['no','Nombre/s',1],['dni','DNI',1],['nac','Fecha de nacimiento',1,'date'],['hab','Habitación y cama',1],['os','Obra social / prepaga',1],['afil','N° de afiliado'],['domicilio','Domicilio previo'],['famn','Familiar responsable',1],['fampar','Parentesco / rol'],['famtel','Teléfono del familiar',1],['emergencia','Contacto de emergencia'],['lugarIng','Lugar / modo de ingreso'],['libro','Folio en el Libro de ingresos rubricado',1]];
  modal('Nuevo ingreso',`<p class="hint">Solo datos personales y administrativos. Lo clínico (antecedentes, medicación, exámenes) lo carga el médico.</p><div class="fgrid">${F.map(f=>`<label class="fl">${f[1]}${f[2]?' *':''}<input name="${f[0]}" type="${f[3]||'text'}"${f[0]==='dni'?' inputmode="numeric" placeholder="Ej.: 99.900.010"':''}></label>`).join('')}
    <label class="fl">Sexo<select name="sexo"><option>Femenino</option><option>Masculino</option><option>Otro / no informa</option></select></label></div>`,'Registrar ingreso',fd=>{
    const v=k=>String(fd.get(k)||'').trim();for(const f of F)if(f[2]&&!v(f[0]))return 'Falta: '+f[1]+'.';
    const dniN=v('dni').replace(/\D/g,'');if(dniN.length<7||dniN.length>8)return 'El DNI debe tener 7 u 8 números.';
    if(S.residents.some(r=>r.dni.replace(/\D/g,'')===dniN))return 'Ya existe un residente con ese DNI (la historia clínica es única por persona: Dec. 1089/12 art. 17).';
    if(v('nac')>=dayKey(Date.now()))return 'Revisá la fecha de nacimiento.';
    const dni=dniN.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    const r={id:uid('r'),ap:v('ap'),no:v('no'),dni,nac:v('nac'),sexo:fd.get('sexo'),hab:v('hab'),os:v('os'),afil:v('afil'),ingreso:dayKey(Date.now()),lugarIng:v('lugarIng'),domicilio:v('domicilio'),
      medico:'Dra. Silvia Ferraro — Clínica médica — MP 99.001 — 0291 555-0101',familiar:{n:v('famn'),par:v('fampar'),tel:v('famtel')},emergencia:v('emergencia')||(v('famn')+' — '+v('famtel')),emergServ:'Emergencias contratadas (ficticio) — 0291 555-0911',
      grupo:'Sin dato',directivas:'No registradas',libro:'Libro de ingresos rubricado — '+v('libro'),completo:false,ant:{pat:[],quir:[],alergias:[],habitos:'',fam:'',intern:'',vac:'',dx:[]},medHab:[],exa:null,
      estado:'activo',rangos:{},rangosHist:[],hist:[],egreso:null};
    S.residents.push(r);audit('Ingreso de residente',r.id,r.ap+', '+r.no+' — DNI '+r.dni);S.userAdded++;save();go('res',r.id,'datos');toast('Ingreso registrado. Faltan los datos clínicos y la documentación.');return true;});
}

/* ---------- 2. documentación ---------- */

    const cls=est==='Entregado'?'ok':est==='Faltante'?'bad':'';const hist=S.doc.filter(x=>x.resId===r.id&&x.item===it).length;
    return `<tr><td>${esc(it)}${d&&d.nota?`<div class="small muted">${esc(d.nota)}</div>`:''}</td><td><span class="pill ${cls}">${esc(est)}</span></td><td class="small">${d?esc(uName(d.por))+' · '+fd(d.ts):'—'}${hist>1?`<div class="muted">${hist} movimientos</div>`:''}</td>${pr?'':`<td>${canW('documentacion',r)?`<button class="btn sm" onclick="formDoc('${r.id}',${i})">Cambiar</button>`:''}</td>`}</tr>`;}).join('')}</tbody></table></div>`;
}
function tabDocs(r){

function formDoc(rid,i){

    <label class="fl">Nota (opcional)<input name="nota" placeholder="Ej.: copia simple; original en carpeta"></label><p class="small muted">El estado anterior queda en el historial.</p>`,'Guardar',fd=>{

}

/* ---------- 3-5. antecedentes, medicación habitual, exámenes ---------- */

  const l=S.ax.filter(x=>x.resId===r.id&&x.sec===sec);if(!l.length)return '';
  return '<h3 class="sub">Agregado después del ingreso</h3>'+l.map(x=>`<div class="rec ${recCls(x)}"><div class="body">${sec==='ant'?`<span class="pill ${x.cat==='Alergia'?'bad':''}">${esc(x.cat)}</span> ${esc(x.texto)}`:sec==='exa'?`<b>${esc(x.cat)}</b> (${fdKey(x.fecha)}): ${esc(x.texto)}`:esc(x.texto)}</div><div>${firma(x.por,x.tc)}</div>${recNotes('ax',x)}${pr?'':recActs('ax',x)}</div>`).join('');
}
function antHtml(r,pr){

}
function tabAnt(r){return `<div class="card"><div class="sec-h"><h2>Antecedentes y alergias</h2>${canW('antecedentes',r)?`<button class="btn pri" onclick="formAx('${r.id}','ant')">+ Agregar</button>`:''}</div><p class="hint">Lo cargado al ingreso no se edita: lo nuevo se agrega con fecha y firma.</p>${antHtml(r,false)}</div>`;}

function tabMedHab(r){return `<div class="card"><div class="sec-h"><h2>Medicación habitual (declarada al ingreso)</h2>${canW('antecedentes',r)?`<button class="btn pri" onclick="formAx('${r.id}','medhab')">+ Agregar</button>`:''}</div><p class="hint">Lo que el residente traía al ingresar, con recetas archivadas en el legajo (Ley 14.263 art. 6 inc. g). Lo que se da hoy está en <a href="#/r/${r.id}/ind">Indicaciones médicas</a>.</p>${medHabHtml(r,false)}</div>`;}

function tabExa(r){return `<div class="card"><div class="sec-h"><h2>Exámenes de ingreso</h2>${canW('antecedentes',r)?`<button class="btn pri" onclick="formAx('${r.id}','exa')">+ Agregar resultado</button>`:''}</div>${exaHtml(r,false)}</div>`;}

/* ---------- escalas ---------- */
function escHtml(r,pr){
  const l=byRes('esc',r.id,true).slice().reverse();
  const last={};byRes('esc',r.id).forEach(x=>last[x.tipo]=x);
  let h=`<div class="tscroll"><table><thead><tr><th>Escala</th><th>Qué mide</th><th>Último puntaje</th><th>Interpretación</th><th>Fecha</th></tr></thead><tbody>${Object.keys(ESCALAS).map(k=>{const x=last[k];const E=ESCALAS[k];
    return `<tr><td><b>${k}</b></td><td class="small">${E.d}</td><td class="num${x&&E.a(+x.puntaje)?' hi':''}">${x?x.puntaje+' / '+E.max:'—'}</td><td>${x?esc(E.i(+x.puntaje)):'—'}</td><td>${x?fd(x.ts):'—'}</td></tr>`;}).join('')}</tbody></table></div>`;
  h+='<h3 class="sub">Historial</h3>'+(l.length?l.map(x=>`<div class="rec ${recCls(x)}"><div class="top2"><div class="body"><b>${esc(x.tipo)}: ${x.puntaje}</b> — ${esc(ESCALAS[x.tipo]?ESCALAS[x.tipo].i(+x.puntaje):'')}${x.obs?' · '+esc(x.obs):''}</div>${firma(x.por,x.ts)}</div>${recNotes('esc',x)}${pr?'':recActs('esc',x)}</div>`).join(''):'<p class="empty">Sin valoraciones.</p>');
  return h;
}
function tabEsc(r){return `<div class="card"><div class="sec-h"><h2>Escalas geriátricas</h2>${canW('escalas',r)?`<button class="btn pri" onclick="formEsc('${r.id}')">+ Nueva valoración</button>`:''}</div><p class="hint">Se registra el puntaje total y la interpretación sale sola (puntos de corte de referencia; en el sistema real los define la residencia). Conviene reevaluar al ingreso, cada 6 meses y después de una caída o internación.</p>${escHtml(r,false)}</div>`;}
function formEsc(rid,corrId){
  const r=getRes(rid),o=corrId?find('esc',corrId):{tipo:'Barthel',puntaje:'',obs:''};if(!canW('escalas',r))return deny('registrar escalas',rid);
  const perm=escPermitidas();if(corrId&&!perm.includes(o.tipo))perm.push(o.tipo);if(!perm.includes(o.tipo))o.tipo=perm[0];
  modal(corrId?'Corregir valoración':'Nueva valoración',`${rol()==='esp'?`<p class="small muted">Como ${esc(me().esp||'especialista')} podés cargar: ${perm.join(', ')}.</p>`:''}<div class="glabel">Escala</div><div class="chips">${perm.map(k=>`<label><input type="radio" name="tipo" value="${k}"${o.tipo===k?' checked':''}><span>${k} (${ESCALAS[k].min}-${ESCALAS[k].max})</span></label>`).join('')}</div>
    <label class="fl">Puntaje total<input name="puntaje" inputmode="numeric" value="${esc(o.puntaje)}" required></label><label class="fl">Observaciones<input name="obs" value="${esc(o.obs)}"></label>${corrId?'':papelBlock()}`,corrId?'Guardar corrección':'Guardar',fd=>{
    const t=fd.get('tipo'),p=Number(String(fd.get('puntaje')).replace(',','.')),E=ESCALAS[t];
    if(!E||!perm.includes(t))return 'Elegí una escala permitida.';if(!Number.isInteger(p)||p<E.min||p>E.max)return `El puntaje de ${t} va de ${E.min} a ${E.max}.`;
    const x={resId:rid,tipo:t,puntaje:p,obs:String(fd.get('obs')||'').trim()};return saveRec('esc',x,fd,corrId,'Escala '+t);});
}

/* ---------- indicaciones ---------- */
function tabInd(r){
  const all=byRes('ind',r.id,true).slice().reverse(),vig=all.filter(i=>estadoInd(i)==='vigente');
  return `<div class="card"><div class="sec-h"><h2>Indicaciones médicas</h2>${canW('indicaciones',r)?`<button class="btn pri" onclick="formInd('${r.id}')">+ Nueva indicación</button>`:''}</div>
    <p class="hint">Cada indicación queda con fecha, hora y médico. <b>Modificar</b> crea una línea nueva y deja la anterior tachada a la vista. <b>Suspender</b> deja constancia de cuándo y por qué. <b>Anular</b> es solo para un error de carga. Nada se borra (Dec. 1089/2012 art. 15). De acá sale la planilla de medicación.</p>
    ${can('indicaciones')?'':lockMsg('indicaciones','indicar, modificar ni suspender')}
    <div class="seg"><button class="${UI.indView==='vig'?'on':''}" onclick="UI.indView='vig';render()">Vigentes (${vig.length})</button><button class="${UI.indView==='hist'?'on':''}" onclick="UI.indView='hist';render()">Historial completo (${all.length})</button></div>
    <div style="margin-top:12px">${(UI.indView==='vig'?vig:all).map(i=>indCard(i,UI.indView==='vig')).join('')||'<p class="empty">Sin indicaciones.</p>'}</div></div>`;
}
function prevChain(i){let h='',p=i.reemplazaA&&getInd(i.reemplazaA);while(p&&p.mod){h+=`<div class="prev">Antes: <s>${indDesc(p)}</s><br>Indicada ${fdt(p.fecha)} · modificada ${fdt(p.mod.fecha)} por ${esc(uFull(p.mod.por))}. Motivo: ${esc(p.mod.motivo)}</div>`;p=p.reemplazaA&&getInd(p.reemplazaA);}return h;}
function indCard(i,vista){
  const e=estadoInd(i),r=getRes(i.resId);
  const cls=e==='anulada'?'anulado':(e==='suspendida'||e==='modificada')?'susp':'';

  return h+'</div>';
}

function slotHtml(r,s,dk,now,w){
  let cls='',txt='';const cuando=ts=>dayKey(ts)===dk?ft(ts):fdt(ts);
  if(s.estado==='dado'){cls='st-dado';txt=`<span class="pill ok">Dado ${cuando(s.reg.ts)}</span> ${esc(uName(s.reg.por))}${s.reg.papel?' <span class="pill warn">desde papel</span>':''}`;}
  else if(s.estado==='no'){cls='st-no';txt=`<span class="pill warn">NO DADO</span> ${esc(s.reg.motivo)} — ${esc(uName(s.reg.por))} ${cuando(s.reg.ts)}`;}
  else if(s.ts+HOUR<now){cls='st-atr';txt='<span class="pill bad">Atrasada — sin registrar</span>';}
  else if(s.ts>now){cls='st-fut';txt='<span class="pill">Programada</span>';}
  else txt='<span class="pill pri">Pendiente</span>';
  const old=s.todos.filter(a=>a.anul).map(a=>`<div class="old">${a.estado==='dado'?'Dado':'No dado'} ${ft(a.ts)} — ${esc(uName(a.por))}</div><div class="small" style="color:var(--bad)">Anulado ${fdt(a.anul.fecha)} por ${esc(uName(a.anul.por))}: ${esc(a.anul.motivo)}</div>`).join('');
  let acts='';
  if(w){if(s.estado==='pend'&&s.ts<=now+2*HOUR)acts=`<button class="btn ok" onclick="darDosis('${r.id}','${s.ind.id}','${dk}','${s.hora}')">Dado</button><button class="btn no" onclick="noDado('${r.id}','${s.ind.id}','${dk}','${s.hora}')">No dado</button>`;
    else if(s.reg&&canAnular('dosis',s.reg))acts=`<button class="btn link" onclick="anular('dosis','${s.reg.id}')">Anular con motivo</button>`;}
  return `<div class="slot ${cls}"><div class="sh">${s.hora}</div><div class="sd">${indDesc(s.ind)}${s.ind.obs?`<div class="small muted">${esc(s.ind.obs)}</div>`:''}<div class="small" style="margin-top:4px">${txt}</div>${old}</div><div class="sa">${acts}</div></div>`;
}

const CHV={
  ta:{l:'Tensión arterial',u:'mmHg',s:[['tas','Sistólica','#6B4A3C'],['tad','Diastólica','#C99A84']]},
  fc:{l:'Frecuencia cardíaca',u:'lpm',s:[['fc','FC','#6B4A3C']],b:'fc'},temp:{l:'Temperatura',u:'°C',s:[['temp','T°','#6B4A3C']],b:'temp'},
  sat:{l:'Saturación O₂',u:'%',s:[['sat','SatO₂','#6B4A3C']],b:'sat'},glu:{l:'Glucemia',u:'mg/dl',s:[['glu','Glucemia','#6B4A3C']],b:'glu'},
  peso:{l:'Peso',u:'kg',s:[['peso','Peso','#6B4A3C']]},fr:{l:'Frecuencia respiratoria',u:'rpm',s:[['fr','FR','#6B4A3C']],b:'fr'},
  dolor:{l:'Dolor',u:'0-10',s:[['dolor','Dolor','#6B4A3C']],b:'dolor'}
};
function chartBlock(r){return `<div class="chart"><div class="vchips" aria-label="Variable del gráfico">${Object.keys(CHV).map(k=>`<button class="${UI.chartVar===k?'on':''}" onclick="UI.chartVar='${k}';render()">${CHV[k].l}</button>`).join('')}</div>${chartSvg(r,UI.chartVar)}</div>`;}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return (m<1.5?1:m<3?2:m<7?5:10)*p;}
function chartSvg(r,v){
  const def=CHV[v];const pts=byRes('ctl',r.id).filter(c=>def.s.some(s=>c[s[0]]!==''&&c[s[0]]!=null));
  if(pts.length<2)return `<p class="empty">Sin datos suficientes para graficar ${def.l.toLowerCase()}.</p>`;
  const W=760,H=270,ml=46,mr=74,mt=14,mb=34,t0=pts[0].ts,t1=pts[pts.length-1].ts;
  const band=def.b?lim(r.id,def.b):null,lines=v==='ta'?[[lim(r.id,'tas')[1],'sist.'],[lim(r.id,'tad')[1],'diast.']]:null;
  const vals=[];pts.forEach(c=>def.s.forEach(s=>{if(c[s[0]]!==''&&c[s[0]]!=null)vals.push(+c[s[0]]);}));
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(band){lo=Math.min(lo,band[0]);hi=Math.max(hi,Math.min(band[1],hi+(hi-lo)*.3+1));}
  if(lines)lines.forEach(l=>{lo=Math.min(lo,l[0]);hi=Math.max(hi,l[0]);});
  const pd=(hi-lo)*0.08||1;lo-=pd;hi+=pd;const st=niceStep((hi-lo)/5);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const X=t=>ml+(t1===t0?0.5:(t-t0)/(t1-t0))*(W-ml-mr),Y=y=>mt+(1-(y-lo)/(hi-lo))*(H-mt-mb);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${esc(def.l)}">`;
  if(band){const b0=Math.max(lo,band[0]),b1=Math.min(hi,band[1]);g+=`<rect x="${ml}" y="${Y(b1)}" width="${W-ml-mr}" height="${Math.max(0,Y(b0)-Y(b1))}" fill="#e6f4eb"/>`;}
  for(let y=lo;y<=hi+1e-9;y+=st)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(y)}" y2="${Y(y)}" stroke="#F3E6DC"/><text x="${ml-6}" y="${Y(y)+4}" text-anchor="end" font-size="11" fill="#8C7166">${num(Math.round(y*10)/10)}</text>`;
  if(lines)lines.forEach(l=>{g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(l[0])}" y2="${Y(l[0])}" stroke="#d98c84" stroke-dasharray="4 4"/><text x="${W-mr+4}" y="${Y(l[0])+4}" font-size="10" fill="#C62828">máx ${l[1]} ${l[0]}</text>`;});
  const d0=keyToTs(dayKey(t0),'00:00'),every=(t1-t0)>10*DAY?7:1;
  for(let t=d0;t<=t1;t+=DAY){const xx=X(t);if(xx<ml)continue;const idx=Math.round((t-d0)/DAY);if(idx%every)continue;const dd=new Date(t);
    g+=`<line x1="${xx}" x2="${xx}" y1="${mt}" y2="${H-mb}" stroke="#F7EEE7"/><text x="${xx}" y="${H-mb+16}" text-anchor="middle" font-size="11" fill="#8C7166">${pad(dd.getDate())}/${pad(dd.getMonth()+1)}</text>`;}
  g+=`<line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" stroke="#D9C4B6"/>`;
  def.s.forEach(s=>{const p=pts.filter(c=>c[s[0]]!==''&&c[s[0]]!=null);if(!p.length)return;
    g+=`<polyline fill="none" stroke="${s[2]}" stroke-width="2" stroke-linejoin="round" points="${p.map(c=>X(c.ts).toFixed(1)+','+Y(+c[s[0]]).toFixed(1)).join(' ')}"/>`;
    p.forEach(c=>{const o=oor(s[0],c[s[0]],r.id),cx=X(c.ts).toFixed(1),cy=Y(+c[s[0]]).toFixed(1);
      g+=`<g><title>${fdt(c.ts)} — ${s[1]}: ${num(c[s[0]])} ${def.u}${o?' (fuera de rango)':''}</title><circle cx="${cx}" cy="${cy}" r="10" fill="transparent"/>${o?`<circle cx="${cx}" cy="${cy}" r="5" fill="#C62828" stroke="#fff" stroke-width="2"/>`:`<circle cx="${cx}" cy="${cy}" r="${p.length>30?2.5:4}" fill="${s[2]}"/>`}</g>`;});
    const lp=p[p.length-1];g+=`<text x="${X(lp.ts)+8}" y="${Y(+lp[s[0]])+4}" font-size="11" fill="#4A2C20" font-weight="600">${num(lp[s[0]])}</text>`;});
  return g+'</svg><div class="legend">'+def.s.map(s=>`<span><i style="background:${s[2]}"></i>${s[1]} (${def.u})</span>`).join('')+'<span><i class="dot" style="background:#C62828"></i>Fuera de rango</span>'+(band?'<span><i class="bandk"></i>Rango normal</span>':'')+'<span class="muted">Tocá o pasá el mouse por un punto para ver el valor.</span></div>';
}

/* ---------- resumen mensual ---------- */
function mesesDisp(r){const set={};set[dayKey(Date.now()).slice(0,7)]=1;['ctl','evm','eve','rmes'].forEach(c=>S[c].forEach(x=>{if(x.resId===r.id)set[x.mes||dayKey(x.ts).slice(0,7)]=1;}));return Object.keys(set).sort().reverse();}
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
function statsMes(r,mes){
  const inM=x=>valid(x)&&dayKey(x.ts).slice(0,7)===mes;
  const c=S.ctl.filter(x=>x.resId===r.id&&inM(x));
  const filas=CF.filter(f=>f.k!=='tad').map(f=>{
    if(f.k==='tas'){const dd=c.filter(x=>x.tas!=='');if(!dd.length)return null;const ss=dd.map(x=>+x.tas),di=dd.map(x=>+x.tad);
      return ['TA (mmHg)',Math.round(avg(ss))+'/'+Math.round(avg(di)),Math.min(...ss)+'/'+Math.min(...di),Math.max(...ss)+'/'+Math.max(...di),dd.filter(x=>oor('tas',x.tas,r.id)||oor('tad',x.tad,r.id)).length,dd.length];}
    const v=c.map(x=>x[f.k]).filter(x=>x!==''&&x!=null).map(Number);if(!v.length)return null;
    return [f.l+' ('+f.u+')',num(Math.round(avg(v)*10)/10),num(Math.min(...v)),num(Math.max(...v)),v.filter(x=>oor(f.k,x,r.id)).length,v.length];}).filter(Boolean);
  const a=S.dosis.filter(x=>x.resId===r.id&&!x.anul&&x.dia.slice(0,7)===mes&&x.hora!=='SOS');
  const dad=a.filter(x=>x.estado==='dado').length,no=a.filter(x=>x.estado==='no');
  const sos=S.dosis.filter(x=>x.resId===r.id&&!x.anul&&x.dia.slice(0,7)===mes&&x.hora==='SOS').length;
  const evm=S.evm.filter(x=>x.resId===r.id&&inM(x)).sort((x,y)=>x.ts-y.ts),allEvm=byRes('evm',r.id);
  const p0=keyToTs(mes+'-01','00:00'),pE=Math.min(r.estado==='activo'?Date.now():keyToTs(r.egreso.fecha,'23:59'),keyToTs(addDays(mes+'-01',32).slice(0,7)+'-01','00:00'));
  const huecos=[],prev=allEvm.filter(x=>x.ts<p0).pop();let cur=prev?prev.ts:Math.max(p0,keyToTs(r.ingreso,'00:00'));
  evm.forEach(x=>{if(x.ts-cur>7*DAY)huecos.push('entre el '+fd(cur)+' y el '+fd(x.ts));cur=x.ts;});
  if(pE-cur>7*DAY)huecos.push('desde el '+fd(cur)+' sin evolución');
  const eve=S.eve.filter(x=>x.resId===r.id&&inM(x)),inc=S.inc.filter(x=>x.resId===r.id&&inM(x)),evesp=S.evesp.filter(x=>x.resId===r.id&&inM(x));

}
function statsHtml(r,mes){

  h+=s.filas.length?`<div class="tscroll"><table><thead><tr><th>Variable</th><th>Promedio</th><th>Mínimo</th><th>Máximo</th><th>Fuera de rango</th><th>Mediciones</th></tr></thead><tbody>${s.filas.map(f=>`<tr><td>${f[0]}</td><td class="num">${f[1]}</td><td class="num">${f[2]}</td><td class="num">${f[3]}</td><td class="num${f[4]?' hi':''}">${f[4]}</td><td class="num">${f[5]}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Sin controles este mes.</p>';
  const tot=s.dad+s.no.length;
  h+=`<h3 class="sub">Medicación</h3><p>Dosis registradas: <b>${tot}</b> · dadas: <b>${s.dad}</b> · no dadas: <b>${s.no.length}</b>${tot?' · cumplimiento: <b>'+Math.round(s.dad/tot*100)+' %</b>':''} · a demanda (SOS): <b>${s.sos}</b></p>`;
  if(s.no.length)h+='<ul class="li">'+s.no.map(x=>{const i=getInd(x.indId);return `<li>${fdKey(x.dia)} ${x.hora} — ${esc(i?i.farmaco:'')}: ${esc(x.motivo)}</li>`;}).join('')+'</ul>';

  {const cnt={};s.evesp.forEach(x=>cnt[x.especialidad]=(cnt[x.especialidad]||0)+1);h+=`<h3 class="sub">Especialistas</h3><p>${Object.keys(cnt).length?Object.keys(cnt).map(k=>esc(k)+': <b>'+cnt[k]+'</b>').join(' · '):'Sin evoluciones de especialistas este mes.'}</p>`;}
  if(s.inc.length)h+='<ul class="li">'+s.inc.map(x=>`<li>${fdt(x.ts)} — <b>${esc(x.tipo)}</b>: ${esc(x.texto)}</li>`).join('')+'</ul>';
  return h;
}
function tabMes(r){

  const extra=(col==='ind'&&rec.reemplazaA)?'<p class="small muted">La indicación anterior no se reactiva sola. Si corresponde, se carga de nuevo.</p>':'';

function backupVencido(){const l=S.config.lastBackup;return !l||Date.now()-l>S.config.backupHoras*HOUR;}
function download(name,text,mime){LAST_DOWNLOAD={name,text};try{const b=new Blob([text],{type:mime||'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);}catch(e){toast('No se pudo descargar en este navegador.');}}
function stamp(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes());}
async function buildBackup(tag){
  const now=Date.now();
  const datos=JSON.parse(JSON.stringify(S));const txt=JSON.stringify(datos);const h=await sha256(txt);
  return {name:'respaldo-nuestrohogar-'+(tag?tag+'-':'')+stamp(now)+'.json',hash:h.hex,metodo:h.m,
    text:JSON.stringify({formato:'nuestrohogar-respaldo',version:VER,generado:now,generadoPor:SESSION?SESSION.user:'',algoritmo:'SHA-256',metodo:h.m,hash:h.hex,aviso:'BOCETO — datos ficticios',datos})};
}
async function exportBackup(){
  if(!can('exportar'))return deny('exportar el respaldo');
  S.config.lastBackup=Date.now();audit('Exportación de respaldo completo','','');
  const b=await buildBackup('');S.config.lastBackupHash=b.hash;save();download(b.name,b.text,'application/json');render();toast('Respaldo descargado: '+b.name);return b;
}

  else{rows=[['Residente','DNI','Día','Horario','Medicamento','Dosis','Estado','Motivo','Hora real','Registró','Desde papel','Anulado']].concat(S.dosis.slice().sort((a,b)=>a.ts-b.ts).map(a=>{const i=getInd(a.indId)||{};return [resN(a.resId),(getRes(a.resId)||{}).dni,fdKey(a.dia),a.hora,i.farmaco,i.dosis,a.estado==='dado'?'Dado':'No dado',a.motivo,fdt(a.ts),uFull(a.por),a.papel?'Sí':'No',a.anul?'Sí: '+a.anul.motivo:'No'];}));name='medicacion';}

}
async function checkRestore(text){
  let o;try{o=JSON.parse(text);}catch(e){return {ok:false,err:'El archivo no es un respaldo válido (no se puede leer como JSON).'};}
  if(!o||o.formato!=='nuestrohogar-respaldo'||!o.datos||typeof o.datos!=='object')return {ok:false,err:'El archivo no es un respaldo de este sistema.'};
  const d=o.datos,raw=JSON.stringify(d),req=['residents','audit'].concat(COLS);
  if((o.version||0)<5&&!Array.isArray(d.evesp))d.evesp=[];
  for(const k of req)if(!Array.isArray(d[k]))return {ok:false,err:'Al respaldo le falta la sección "'+k+'". Está incompleto o dañado.'};
  if(!d.users||typeof d.users!=='object'||!Object.values(d.users).some(u=>u.rol==='admin'&&u.estado==='activo'))return {ok:false,err:'El respaldo no tiene un administrador activo: no se podría volver a entrar.'};
  if(!d.config)return {ok:false,err:'Al respaldo le falta la configuración.'};
  if(typeof o.hash!=='string'||o.hash.length!==64)return {ok:false,err:'El respaldo no tiene código de verificación.'};
  const h=await sha256(raw);
  if(h.hex!==o.hash)return {ok:false,err:'El código de verificación no coincide: el archivo fue modificado o está dañado. No se restaura.'};
  const va=verifyAudit(d.audit);
  const nReg=COLS.reduce((s,k)=>s+d[k].length,0);
  return {ok:true,obj:o,resumen:{generado:o.generado,por:o.generadoPor,res:d.residents.length,activos:d.residents.filter(r=>r.estado==='activo').length,reg:nReg,users:Object.keys(d.users).length,aud:d.audit.length,audOk:va.ok,hash:o.hash}};
}
function restoreFile(input){
  if(!can('restaurar')){deny('restaurar respaldos');return;}
  const f=input.files&&input.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{handleRestoreText(String(rd.result),f.name);input.value='';};rd.onerror=()=>toast('No se pudo leer el archivo.');rd.readAsText(f);
}
async function handleRestoreText(text,fname){
  if(!can('restaurar'))return deny('restaurar respaldos');
  const c=await checkRestore(text);
  if(!c.ok){audit('Restauración rechazada','',fname+': '+c.err);save();modal('No se puede restaurar',`<div class="status bad">${esc(c.err)}</div><p class="small muted">Archivo: ${esc(fname)}. Los datos actuales no se tocaron.</p>`,null);return c;}
  const s=c.resumen;

    if(!fd.get('conf'))return 'Marcá la confirmación.';applyRestore(c.obj,fname);return true;});

}
async function applyRestore(o,fname){

  formEsc:a=>({resId:a[0],tab:'esc',titulo:'Escala geriátrica'}),formInd:a=>({resId:a[0],tab:'ind',titulo:a[1]?'Modificación de indicación':'Nueva indicación'}),
  suspInd:a=>({resId:(getInd(a[0])||{}).resId,tab:'ind',titulo:'Suspensión de indicación'}),noDado:a=>({resId:a[0],tab:'dosis',titulo:'Medicación no dada '+fdKey(a[2])+' '+a[3]}),
  darDosis:a=>({resId:a[0],tab:'dosis',titulo:'Dosis cargada desde papel '+fdKey(a[2])+' '+a[3]}),darSOS:a=>({resId:a[0],tab:'dosis',titulo:'Dosis a demanda (SOS)'}),
  formAx:a=>({resId:a[0],tab:a[1],titulo:'Antecedente / examen / medicación habitual'}),formDatos:a=>({resId:a[0],tab:'datos',titulo:'Datos personales'}),
  formEgreso:a=>({resId:a[0],tab:'datos',titulo:'Egreso'}),formIngreso:()=>({resId:'',tab:'',titulo:'Nuevo ingreso'}),
  formDoc:a=>({resId:a[0],tab:'docs',titulo:'Documentación: '+DOC_ITEMS[a[1]]}),formRangos:a=>({resId:a[0],tab:'ctl',titulo:'Rangos de alarma'}),
  formAge:a=>({resId:a[0]||'',tab:a[0]?'age':'',titulo:'Turno de agenda'}),cerrarTurno:a=>({resId:(find('age',a[0])||{}).resId,tab:'age',titulo:'Cierre de turno'}),
  formNov:a=>({resId:a[0]||'',tab:'',titulo:'Novedad de guardia'}),formEsp:a=>({resId:a[0],tab:'evesp',titulo:'Evolución de especialista'}),formRmes:a=>({resId:a[0],tab:'mes',titulo:'Evolución mensual'}),
  anular:a=>({resId:(find(a[0],a[1])||{}).resId,tab:'',titulo:'Anulación de '+COL_LBL[a[0]]})
};
function wrapDraft(name,f){return function(...a){NEXT_DRAFT=Object.assign({fn:name,args:a.map(x=>x===undefined?null:x)},DRAFT_INFO[name](a));try{return f.apply(this,a);}finally{NEXT_DRAFT=null;}};}
formCtl=wrapDraft('formCtl',formCtl);formEvm=wrapDraft('formEvm',formEvm);formEve=wrapDraft('formEve',formEve);formInc=wrapDraft('formInc',formInc);formEsc=wrapDraft('formEsc',formEsc);
formInd=wrapDraft('formInd',formInd);suspInd=wrapDraft('suspInd',suspInd);noDado=wrapDraft('noDado',noDado);darDosis=wrapDraft('darDosis',darDosis);darSOS=wrapDraft('darSOS',darSOS);
formAx=wrapDraft('formAx',formAx);formDatos=wrapDraft('formDatos',formDatos);formEgreso=wrapDraft('formEgreso',formEgreso);formIngreso=wrapDraft('formIngreso',formIngreso);formDoc=wrapDraft('formDoc',formDoc);
formRangos=wrapDraft('formRangos',formRangos);formAge=wrapDraft('formAge',formAge);cerrarTurno=wrapDraft('cerrarTurno',cerrarTurno);formNov=wrapDraft('formNov',formNov);formRmes=wrapDraft('formRmes',formRmes);anular=wrapDraft('anular',anular);formEsp=wrapDraft('formEsp',formEsp);
function draftsBanner(){const l=SESSION?draftsOf(SESSION.user):[];if(!l.length)return '';
  return `<div class="status warn" style="display:block"><b>Tenés ${l.length} borrador${l.length>1?'es':''} sin guardar.</b> No son parte de la historia clínica hasta que los guardes.<ul class="li">${l.map(d=>{const r=getRes(d.resId);return `<li>${esc(d.titulo)}${r?' — '+esc(r.ap+', '+r.no):''} <span class="small">(${fdt(d.ts)})</span> <button class="btn sm" onclick="abrirBorrador('${esc(d.key)}')">Abrir</button> <button class="btn link" onclick="if(draftDiscard('${esc(d.key)}','desde el aviso')){render();toast('Borrador descartado');}">Descartar</button></li>`;}).join('')}</ul></div>`;}

function modal(title,body,okText,onOk){
  const m=$('#modal');CUR_DRAFT=null;
  let dr=null,banner='';
  if(onOk&&NEXT_DRAFT&&SESSION){const D=NEXT_DRAFT;const key=SESSION.user+'|'+D.fn+'|'+D.args.map(x=>x==null?'':x).join(',');
    CUR_DRAFT=Object.assign({key,init:null,recovered:false},D);dr=drLoad()[key];
    if(dr&&dr.user===SESSION.user){CUR_DRAFT.recovered=true;banner=`<div class="status warn" style="display:block"><b>Borrador recuperado del ${fdt(dr.ts)}</b> — revisalo y guardalo. <button type="button" class="btn sm" onclick="descartarActual()">Descartar borrador</button></div>`;}else dr=null;}
  NEXT_DRAFT=null;
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><form id="mform" novalidate>${banner}${body}<div class="merr" id="merr"></div><div class="mbtns"><button type="button" class="btn ghost" onclick="cancelModal()">${onOk?'Cancelar':'Cerrar'}</button>${onOk?`<button class="btn pri" type="submit">${esc(okText)}</button>`:''}</div></form></div>`;
  m.classList.add('on');
  const form=$('#mform');
  if(CUR_DRAFT){const pv=formVals(form);CUR_DRAFT.init=pv?JSON.stringify(pv):null;
    if(dr){fillVals(form,dr.vals);audit('Borrador recuperado',dr.resId,dr.titulo+' — guardado el '+fdt(dr.ts));save();}
    if(form.addEventListener){const h=()=>onDraftInput(formVals(form));form.addEventListener('input',h);form.addEventListener('change',h);}}
  const myDraft=CUR_DRAFT;
  MODAL_OK=onOk?(fd=>{const res=onOk(fd);if(res===true&&myDraft)draftDelete(myDraft.key);return res;}):null;
  form.onsubmit=e=>{e.preventDefault();if(!MODAL_OK)return;let res;try{res=MODAL_OK(new FormData(e.target));}catch(err){res='Error inesperado: '+err.message;}if(res===true)closeModal();else if(typeof res==='string')$('#merr').textContent=res;};
  setTimeout(()=>{const f=m.querySelector('input:not([type=radio]):not([type=checkbox]):not([type=hidden]),textarea,select');if(f)try{f.focus();}catch(e){}},60);
}
/* cerrar sin guardar (Escape, tocar afuera, cierre de sesión): el borrador queda guardado */
function closeModal(){const m=$('#modal');m.classList.remove('on');m.innerHTML='';MODAL_OK=null;CUR_DRAFT=null;}
/* "Cancelar" es una decisión explícita: descarta el borrador */
function cancelModal(){if(CUR_DRAFT&&drLoad()[CUR_DRAFT.key])draftDiscard(CUR_DRAFT.key,'cancelado');closeModal();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function restablecer(){
  if(!can('config'))return deny('restablecer la demo');
  modal('Restablecer la demo','<p>Se borra todo lo cargado durante la prueba (también los borradores) y se vuelven a generar los datos ficticios con fechas de hoy. Se cierra la sesión.</p><p class="small muted">Solo existe en el boceto: en el sistema real no hay un botón así.</p>','Restablecer',()=>{S=seed();save();drSave({});SESSION=null;UI.q='';LOGIN_MSG='Demo restablecida. Ingresá de nuevo.';go('home');return true;});
}
function migrarConfig(){if(S&&S.config&&S.config.sesionMin===15&&!S.config.sesionManual){S.config.sesionMin=5;save();}}

/* ---------- arranque ---------- */
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{LAST_ACT=Date.now();const w=$('#idleWarn');if(w&&!w.hidden)w.hidden=true;},{passive:true}));
setInterval(checkIdle,1000);
(function init(){
  const st=load(),hoy=dayKey(Date.now());
  if(!st||st.v!==VER||(st.userAdded===0&&st.seedDay!==hoy)){S=seed();save();}else S=st;
  migrarConfig();storeNote();route();
})();
</script>
